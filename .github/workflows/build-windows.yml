name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [Side-Quest]
    paths:
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Decode app icons
        run: node scripts/decode-icons.js

      - name: Test path helpers
        working-directory: src-tauri
        run: cargo test --lib --no-default-features

      - name: Build portable exe and NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: OperationalMovements-portable
          path: src-tauri/target/release/OperationalMovements.exe
          if-no-files-found: error

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: OperationalMovements-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
