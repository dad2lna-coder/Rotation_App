name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [Side-Quest]
    paths:
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable

      - name: Decode app icons
        run: node scripts/decode-icons.js

      - name: Prepare frontend dist
        run: node scripts/prepare-frontend.js

      - name: Install frontend deps
        run: npm install

      - name: Test path helpers
        working-directory: src-tauri
        run: cargo test --lib --no-default-features

      - name: Test with Tauri enabled
        working-directory: src-tauri
        run: cargo test --lib

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          includeRelease: false
          includeUpdaterJson: false
          args: --bundles nsis

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: OperationalMovements-portable
          path: src-tauri/target/release/OperationalMovements.exe

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OperationalMovements-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore
