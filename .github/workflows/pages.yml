name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bake demo into the live original HTML
        run: python3 tools/bake_into_original.py

      - name: Apply BLADE chrome helpers on standalone file
        run: python3 tools/apply_blade_ui.py || true

      - name: Embed hook for Blade shell
        run: python3 tools/apply_embed.py

      - name: Commit live HTML when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "original_file/RotationBuilder 1.html"
          if git diff --cached --quiet; then
            echo "original already current"
          else
            git commit -m "Bake embed hook into live HTML"
            git push
          fi

      - name: Extract scripts from original monolith
        run: python3 tools/extract_js.py "$GITHUB_WORKSPACE"

      - name: Bake demo roster into split JS
        run: python3 tools/bake_demo.py || true

      - name: Assemble site
        run: |
          mkdir -p _site/css _site/js _site/original_file _site/docs
          cp index.html _site/
          cp css/blade-console.css _site/css/
          cp js/blade-shell.js _site/js/
          cp -r css _site/ 2>/dev/null || true
          cp -r js _site/ 2>/dev/null || true
          touch _site/.nojekyll
          cp "original_file/RotationBuilder 1.html" "_site/original_file/RotationBuilder 1.html"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
