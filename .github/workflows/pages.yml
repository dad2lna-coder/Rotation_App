name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Rotation repo
        uses: actions/checkout@v4
        with:
          path: rot

      - name: Checkout Blade repo
        uses: actions/checkout@v4
        with:
          repository: dad2lna-coder/BLADE_Alpha
          path: blade

      - name: Copy Blade into Rotation (this is the merge)
        run: |
          cp -a blade/css/. rot/css/
          mkdir -p rot/js rot/lib
          cp -a blade/js/. rot/js/
          cp -a blade/lib/. rot/lib/ || true
          cp blade/index.html rot/index.html

      - name: Bake rotation engine pieces
        working-directory: rot
        run: |
          python3 tools/bake_into_original.py || true
          python3 tools/extract_js.py "$GITHUB_WORKSPACE/rot"
          python3 tools/bake_demo.py || true
          python3 tools/join_rotation.py

      - name: Commit merged Blade+Rotation tree
        working-directory: rot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css js lib
          if git diff --cached --quiet; then
            echo "tree already merged"
          else
            git commit -m "Merge Blade project into Rotation repo (Rotation is F7)"
            git push
          fi

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp -a rot/index.html _site/
          cp -a rot/css _site/
          cp -a rot/js _site/
          cp -a rot/lib _site/ || mkdir -p _site/lib
          mkdir -p _site/original_file
          cp "rot/original_file/RotationBuilder 1.html" "_site/original_file/" || true
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
