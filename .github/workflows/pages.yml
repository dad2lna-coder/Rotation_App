name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bake demo and embed hooks
        run: |
          python3 tools/bake_into_original.py || true
          python3 tools/apply_embed.py || true

      - name: Extract Rotation scripts
        run: python3 tools/extract_js.py "$GITHUB_WORKSPACE"

      - name: Bake demo into extracted JS
        run: python3 tools/bake_demo.py || true

      - name: Build one Blade+Rotation app
        run: python3 tools/build_one_app.py

      - name: Copy Rotation runtime into site
        run: |
          mkdir -p _site/js _site/original_file
          cp -r js/vendor js/core js/engine js/ui _site/js/ 2>/dev/null || true
          cp js/demo-data.js _site/js/ 2>/dev/null || true
          cp "original_file/RotationBuilder 1.html" "_site/original_file/RotationBuilder 1.html"
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
