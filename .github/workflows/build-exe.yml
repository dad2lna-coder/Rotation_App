name: Build Let Them Cook EXE

on:
  push:
    branches: [let-them-cook]
  pull_request:
    branches: [let-them-cook]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-exe:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install npm deps
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Decode app icons
        run: node scripts/decode-icons.js

      - name: Test path helpers
        working-directory: src-tauri
        run: cargo test --lib --no-default-features

      - name: Build portable exe and NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: LetThemCook.exe
          path: src-tauri/target/release/LetThemCook.exe
          if-no-files-found: error

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: LetThemCook-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
