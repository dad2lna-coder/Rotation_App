<!DOCTYPE html>
<html lang="en" class="console">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BLADE / Rotation</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="stylesheet" href="css/blade-console.css" />
</head>
<body class="console-skin">
  <header class="topbar">
    <div class="console-mast">
      <div class="brand">BLADE AIRPORT OPS<span>ROTATION MODULE</span></div>
      <div class="console-meta">AIRPORT: <b id="console-airport">DFW</b></div>
      <div class="console-meta">SYSTEM TIME: <b id="console-time">--:--:--</b></div>
      <div class="console-meta">DATE: <b id="console-date">--/--/----</b></div>
      <div class="console-status-chip">STATUS: READY</div>
    </div>
    <div class="topbar-actions">
      <div id="rot-theme-seg" class="rot-theme-seg" title="Rotation appearance">
        <button type="button" data-theme="dark">Dark</button>
        <button type="button" data-theme="light">Light</button>
        <button type="button" data-theme="vivid">Vivid</button>
      </div>
    </div>
  </header>
  <nav class="tabs">
    <button class="tab-btn" data-tab="setup">[F1] SETUP</button>
    <button class="tab-btn active" data-tab="rotation">[F7] ROTATION</button>
  </nav>
  <main>
    <section class="panel" id="tab-setup">
      <div class="card">
        <div class="section-title">BLADE base</div>
        <p class="muted">This repo is the merge point. Blade is the console. Rotation joins as the F7 module.</p>
      </div>
    </section>
    <section class="panel active" id="tab-rotation">
      <iframe id="rotation-frame" class="rotation-frame" title="Rotation Builder" src="original_file/RotationBuilder%201.html?embed=1"></iframe>
    </section>
  </main>
  <footer class="console-footer">
    <span>SYSTEM: <b>READY</b></span>
    <span>NAV: F1 SETUP · F7 ROTATION</span>
    <span>THEME: ROTATION DARK / LIGHT / VIVID</span>
  </footer>
  <script src="js/blade-shell.js"></script>
</body>
</html>
