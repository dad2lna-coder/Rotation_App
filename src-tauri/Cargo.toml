[package]
name = "operational-movements"
version = "1.0.0"
description = "Operational Movements Discovery Dashboard"
authors = ["dad2lna"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "operational_movements_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["app"]
app = ["dep:tauri", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
